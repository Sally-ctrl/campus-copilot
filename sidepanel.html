<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Campus Copilot</title>
  <link rel="stylesheet" href="./src/style.css" />
</head>
<body>
  <header>
    <h1>Campus Copilot</h1>
    <span id="status" class="badge">Idle</span>
  </header>

  <div class="row">
    <button id="readBtn">Scan this page</button>
    <button id="syncBtn" class="secondary">Sync all courses</button>
  </div>
  <p id="cmsHint" class="muted">Open your GUC CMS to scan. Your list still works here.</p>
  <p id="progress" class="muted"></p>

  <details id="settings">
    <summary>Settings</summary>
    <label>My tutorial group
      <input id="groupInput" placeholder="e.g. T14" />
    </label>
    <button id="clearBtn" class="danger">Clear all items</button>
  </details>

  <div id="courseFilter" class="chips"></div>

  <section>
    <h2>Upcoming deadlines <span id="countDeadlines" class="count"></span></h2>
    <ul id="deadlineList"></ul>
  </section>

  <section>
    <h2>Coursework · Next <span id="countNext" class="count"></span></h2>
    <ul id="nextList"></ul>
  </section>

  <details class="past">
    <summary><h2>Past &amp; done <span id="countPast" class="count"></span></h2></summary>
    <ul id="pastList"></ul>
  </details>

  <p id="empty" class="muted">No items yet. Open a course page and click "Scan this page", or open your Courses list and click "Sync all courses".</p>

  <script type="module" src="./src/sidepanel.js"></script>
</body>
</html>
